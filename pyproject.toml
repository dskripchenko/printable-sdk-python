[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printable-sdk"
version = "1.0.0"
description = "Official Python SDK for the Printable document-generation service: HMAC-signed integration API client (templates, print-forms, batches, drafts, webhooks)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Denis Skripchenko" }]
keywords = ["printable", "sdk", "api-client", "pdf", "docx", "document-generation", "hmac"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/dskripchenko/printable-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/printable_sdk"]

[dependency-groups]
dev = ["pytest>=8"]
