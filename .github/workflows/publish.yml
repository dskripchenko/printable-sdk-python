# Публикация на PyPI через Trusted Publishing (OIDC, без токенов).
# Триггер: пуш тега vX.Y.Z либо ручной запуск (workflow_dispatch).
name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC для trusted publisher
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: |
          python -m pip install --quiet pytest -e .
          python -m pytest -q
      - name: Build distributions
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
